name: Build WebView Link Opener APK

on:
  workflow_dispatch:
  push:
    branches: [webview-link-opener]
    paths:
      - 'webview-link-opener/**'
      - '.github/workflows/build-webview-link-opener.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webview-link-opener
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WebView-Link-Opener-APK
          path: webview-link-opener/app/build/outputs/apk/debug/app-debug.apk
